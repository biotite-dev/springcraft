name: Building and deploying Springcraft

on:
  release:
    types:
      - published
  workflow_dispatch: {}

jobs:
  build-dist:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Install hatch
        run: pip install hatch
      - name: Build dist
        run: hatch build
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  build-docs:
    name: Building documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: springcraft-docs
          mamba-version: "*"
      - name: Installing Springcraft
        run: pip install .[docs]
      - name: Building documentation
        run: sphinx-build doc build/doc
      - name: Zipping documentation
        run: cd build; zip -r doc.zip doc; cd ..
      - uses: actions/upload-artifact@v7
        with:
          name: release-doc
          path: build/doc.zip
          if-no-files-found: error

  upload-package:
    name: Upload package to GitHub Releases & PyPI
    permissions:
      contents: write
      id-token: write
    needs:
      - build-dist
      - build-docs
    runs-on: ubuntu-latest
    environment:
      name: publish
      url: https://pypi.org/project/springcraft/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: List distributions to be uploaded
        run: ls dist
      - name: Upload to GitHub Releases
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/* --clobber
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name == 'release' && github.event.action == 'published'
